name: CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "deployment/**"
      - ".github/workflows/cd.yml"

  workflow_dispatch:

# Explicit permissions for GITHUB_TOKEN
permissions:
  contents: read

# Cancel previous workflow runs for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed to run appropriate jobs
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'

  # Deploy API service
  deploy-api:
    name: Deploy API to Fly.io
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.api == 'true'
    concurrency: deploy-api-group
    outputs:
      url: ${{ steps.api-url.outputs.url }}
      hostname: ${{ steps.api-url.outputs.hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: |
          cd apps/api
          flyctl deploy --remote-only --config fly-api.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get Deployed URL
        if: success()
        id: api-url
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          APP_URL=$(flyctl status --app devorbit-ai-api --json | jq -r '.Hostname')
          echo "hostname=$APP_URL" >> $GITHUB_OUTPUT
          echo "url=https://$APP_URL" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ API deployed successfully!"
          echo "📦 App: devorbit-ai-api"
          echo "🔗 URL: ${{ steps.api-url.outputs.url }}"
          echo "🏥 Health: ${{ steps.api-url.outputs.url }}/health"
          echo "📚 Docs: ${{ steps.api-url.outputs.url }}/docs"

  # Deploy Web service (runs after API if both changed)
  deploy-web:
    name: Deploy Web to Fly.io
    needs: [detect-changes, deploy-api]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.detect-changes.outputs.web == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    concurrency: deploy-web-group
    outputs:
      url: ${{ steps.web-url.outputs.url }}
      hostname: ${{ steps.web-url.outputs.hostname }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Web
        run: |
          cd apps/web
          flyctl deploy --remote-only --config fly-web.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get Deployed URL
        if: success()
        id: web-url
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          APP_URL=$(flyctl status --app devorbit-ai --json | jq -r '.Hostname')
          echo "hostname=$APP_URL" >> $GITHUB_OUTPUT
          echo "url=https://$APP_URL" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Web deployed successfully!"
          echo "📦 App: devorbit-ai"
          echo "🔗 URL: ${{ steps.web-url.outputs.url }}"
          echo "🏥 Health: ${{ steps.web-url.outputs.url }}/api/health"

  # Deployment status summary
  deployment-status:
    name: Deployment Status
    needs: [detect-changes, deploy-api, deploy-web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.api }}" == "true" ]; then
            if [ "${{ needs.deploy-api.result }}" == "success" ]; then
              echo "### ✅ API - Deployed Successfully" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **App**: \`devorbit-ai-api\`" >> $GITHUB_STEP_SUMMARY
              echo "- **URL**: ${{ needs.deploy-api.outputs.url }}" >> $GITHUB_STEP_SUMMARY
              echo "- **Health**: ${{ needs.deploy-api.outputs.url }}/health" >> $GITHUB_STEP_SUMMARY
              echo "- **Docs**: ${{ needs.deploy-api.outputs.url }}/docs" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ API - Deployment Failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⏭️ API - No Changes Detected" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.detect-changes.outputs.web }}" == "true" ]; then
            if [ "${{ needs.deploy-web.result }}" == "success" ]; then
              echo "### ✅ Web - Deployed Successfully" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- **App**: \`devorbit-ai\`" >> $GITHUB_STEP_SUMMARY
              echo "- **URL**: ${{ needs.deploy-web.outputs.url }}" >> $GITHUB_STEP_SUMMARY
              echo "- **Health**: ${{ needs.deploy-web.outputs.url }}/api/health" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ Web - Deployment Failed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⏭️ Web - No Changes Detected" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Deployment completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
