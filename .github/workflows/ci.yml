name: CI Testing & Quality Checks

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

# Explicit permissions for GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: read

# Cancel previous workflow runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what changed to run appropriate jobs
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'

  # API Code Quality Checks
  api-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      #---------------------------------
      # Checkout repository
      #---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      #---------------------------------
      # Set up Python
      #---------------------------------
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      #---------------------------------
      # Install & configure Poetry
      #---------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      #---------------------------------
      # load cached venv if cache exists
      #---------------------------------
      - name: Cache Poetry virtualenv
        id: poetry-cache
        uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #---------------------------------
      # Install dependencies if cache does not exist
      #---------------------------------
      - name: Install dependencies if cache does not exist
        if: steps.poetry-cache.outputs.cache-hit != 'true'
        working-directory: apps/api
        run: |
          poetry install --no-interaction --no-root

      #---------------------------------
      # Install project
      #---------------------------------
      - name: Install Project
        working-directory: apps/api
        run: |
          poetry install --no-interaction

      #---------------------------------
      # Run Code Quality Checks
      #---------------------------------
      - name: Run Ruff linting
        working-directory: apps/api
        run: |
          echo "🔍 Running Ruff linting..."
          poetry run ruff check app/ --output-format=github

      - name: Run Ruff formatting check
        working-directory: apps/api
        run: |
          echo "📏 Checking Ruff formatting..."
          poetry run ruff format app/ --check

      - name: Run Black formatting check
        working-directory: apps/api
        run: |
          echo "🖤 Checking Black formatting..."
          poetry run black app/ --check --diff

      - name: Run isort import sorting check
        working-directory: apps/api
        run: |
          echo "📚 Checking import sorting..."
          poetry run isort app/ --check-only --diff

      - name: Run MyPy type checking
        working-directory: apps/api
        run: |
          echo "🔍 Running MyPy type checking..."
          poetry run mypy app/

      #---------------------------------
      # Run tests with coverage
      #---------------------------------
      - name: Run tests with coverage
        working-directory: apps/api
        env:
          SECRET_KEY: "test-secret-key-for-ci-only-min-32-chars-long"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ANTHROPIC_API_KEY: "test-api-key"
          ENVIRONMENT: "test"
          DEBUG: "true"
          VERSION: "1.0.0"
          API_V1_STR: "/api/v1"
          BACKEND_CORS_ORIGINS: "*"
          PROJECT_NAME: "DevOrbit AI API"

        run: |
          echo "🧪 Running tests with coverage..."
          poetry run pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      #---------------------------------
      # Upload coverage reports to Codecov
      #---------------------------------
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: api
          name: codecov-api
          fail_ci_if_error: false

      #---------------------------------
      # API Code Quality Summary
      #---------------------------------
      - name: API Code Quality Summary
        run: |
          echo "## 📊 API Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Linting**: Ruff checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Formatting**: Black & isort checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Type Checking**: MyPy validation completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Testing**: Pytest with coverage completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Configuration**: 120-character line length, Python 3.11+" >> $GITHUB_STEP_SUMMARY

  # Web Code Quality Checks
  web-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      #---------------------------------
      # Checkout repository
      #---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      #---------------------------------
      # Set up Node.js
      #---------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      #---------------------------------
      # Install dependencies
      #---------------------------------
      - name: Install dependencies
        working-directory: apps/web
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      #---------------------------------
      # Run Code Quality Checks
      #---------------------------------
      - name: Run ESLint
        working-directory: apps/web
        run: |
          echo "🔍 Running ESLint..."
          npm run lint:check

      - name: Run TypeScript type checking
        working-directory: apps/web
        run: |
          echo "🔍 Running TypeScript type checking..."
          npm run type-check

      - name: Run Prettier formatting check
        working-directory: apps/web
        run: |
          echo "💄 Checking Prettier formatting..."
          npm run format:check

      #---------------------------------
      # Run tests
      #---------------------------------
      - name: Run tests
        working-directory: apps/web
        run: |
          echo "🧪 Running tests..."
          npm run test

      #---------------------------------
      # Build application
      #---------------------------------
      - name: Build application
        working-directory: apps/web
        run: |
          echo "🏗️ Building Next.js application..."
          npm run build

      #---------------------------------
      # Web Code Quality Summary
      #---------------------------------
      - name: Web Code Quality Summary
        if: always()
        run: |
          echo "## 🌐 Web Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Linting**: ESLint checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Type Checking**: TypeScript validation completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Formatting**: Prettier checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Testing**: Vitest execution completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build**: Next.js build completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Configuration**: Node.js 20, Next.js 15, TypeScript 5" >> $GITHUB_STEP_SUMMARY
