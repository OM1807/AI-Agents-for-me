name: CI Testing & Quality Checks

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

# Cancel previous workflow runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required permissions for the workflow
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect changed paths once and expose outputs for other jobs to consume
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.paths.outputs.api }}
      web: ${{ steps.paths.outputs.web }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            workflows:
              - '.github/workflows/**'

  api-code-quality:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      #---------------------------------
      # Checkout repository
      #---------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      #---------------------------------
      # Set up Python
      #---------------------------------
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      #---------------------------------
      # Install & configure Poetry
      #---------------------------------
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      #---------------------------------
      # Cache Poetry virtualenv
      #---------------------------------
      - name: Cache Poetry virtualenv
        id: poetry-cache
        uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #---------------------------------
      # Install dependencies
      #---------------------------------
      - name: Install dependencies
        working-directory: apps/api
        run: |
          # Install project dependencies into the repo-local venv
          poetry install --no-interactions --no-root

      #---------------------------------
      # Run Code Quality Checks
      #---------------------------------
      - name: Run Ruff linting
        working-directory: apps/api
        run: |
          echo "🔍 Running Ruff linting..."
          poetry run ruff check app/ --output-format=github

      - name: Run Ruff formatting check
        working-directory: apps/api
        run: |
          echo "📏 Checking Ruff formatting..."
          poetry run ruff format app/ --check

      - name: Run Black formatting check
        working-directory: apps/api
        run: |
          echo "🖤 Checking Black formatting..."
          poetry run black app/ --check --diff

      - name: Run isort import sorting check
        working-directory: apps/api
        run: |
          echo "📚 Checking import sorting..."
          poetry run isort app/ --check-only --diff

      - name: Run MyPy type checking
        working-directory: apps/api
        run: |
          echo "🔍 Running MyPy type checking..."
          poetry run mypy app/

      #---------------------------------
      # Run tests with coverage
      #---------------------------------
      - name: Run tests with coverage
        working-directory: apps/api
        run: |
          echo "🧪 Running tests with coverage..."
          poetry run pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      #---------------------------------
      # Upload coverage reports to Codecov
      #---------------------------------
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: api
          name: codecov-api
          fail_ci_if_error: false

      #---------------------------------
      # Code Quality Summary
      #---------------------------------
      - name: Code Quality Summary
        run: |
          echo "## 📊 Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Linting**: Ruff checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Formatting**: Black & isort checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Type Checking**: MyPy validation completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Testing**: Pytest with coverage completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Configuration**: 120-character line length, Python 3.11+" >> $GITHUB_STEP_SUMMARY

  web-code-quality:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Install dependencies
        working-directory: apps/web
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Run ESLint
        working-directory: apps/web
        run: |
          echo "🔍 Running ESLint..."
          npm run lint:check

      - name: Run TypeScript type checking
        working-directory: apps/web
        run: |
          echo "🔍 Running TypeScript type checking..."
          npm run type-check

      - name: Run Prettier formatting check
        working-directory: apps/web
        run: |
          echo "💄 Checking Prettier formatting..."
          npm run format:check

      - name: Run tests
        working-directory: apps/web
        run: |
          echo "🧪 Running tests..."
          npm run test --run

      - name: Build application
        working-directory: apps/web
        run: |
          echo "🏗️ Building application..."
          npm run build

      - name: Web Code Quality Summary
        if: always()
        run: |
          echo "## 🌐 Web Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Linting**: ESLint checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Type Checking**: TypeScript validation completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Formatting**: Prettier checks completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Testing**: Vitest execution completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build**: Next.js application build completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Configuration**: Node.js 20, Next.js 15, TypeScript 5" >> $GITHUB_STEP_SUMMARY
