# Fly.io configuration for SDLC Agents API
app = "sdlc-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  PROJECT_NAME = "SDLC Agents API"
  VERSION = "1.0.0"
  API_V1_STR = "/api/v1"
  HOST = "0.0.0.0"
  PORT = "8000"
  DB_POOL_SIZE = "20"
  DB_MAX_OVERFLOW = "40"
  DB_POOL_TIMEOUT = "30"
  DB_POOL_RECYCLE = "1800"
  ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "30"
  REFRESH_TOKEN_EXPIRE_DAYS = "7"
  CLAUDE_PERMISSION_MODE = "bypassPermissions"
  CLAUDE_REQUEST_TIMEOUT = "300"
  AGENTS_DIR = "/mnt/shared_data/workspaces/"
  LOG_LEVEL = "INFO"
  ENABLE_DOCS = "true"
  ENABLE_REDOC = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# [[http_service.checks]]
#   grace_period = "10s"
#   interval = "30s"
#   method = "GET"
#   timeout = "5s"
#   path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[mounts]
  source = 'sdlc_agents_postgres_data'
  destination = '/mnt/shared_data'
