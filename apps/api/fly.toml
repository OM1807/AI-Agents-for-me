# Fly.io configuration for DevOrbit AI API
app = "devorbit-ai-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  PROJECT_NAME = "DevOrbit AI API"
  VERSION = "1.0.0"
  API_V1_STR = "/api/v1"
  HOST = "0.0.0.0"
  PORT = "8000"
  BACKEND_CORS_ORIGINS = "https://devorbit-ai.fly.dev,http://localhost:3000"
  DB_POOL_SIZE = "20"
  DB_MAX_OVERFLOW = "40"
  DB_POOL_TIMEOUT = "30"
  DB_POOL_RECYCLE = "1800"
  ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "30"
  REFRESH_TOKEN_EXPIRE_DAYS = "7"
  CLAUDE_PERMISSION_MODE = "bypassPermissions"
  CLAUDE_REQUEST_TIMEOUT = "300"
  AGENTS_DIR = "/mnt/shared_data/workspaces/"
  LOG_LEVEL = "INFO"
  ENABLE_DOCS = "true"
  ENABLE_REDOC = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[mounts]
  source = 'devorbit_ai_postgres_data'
  destination = '/mnt/shared_data'
